{% load i18n %}
<form method="get" action="{% url picker_url %}" class="card card-body p-2 mb-4">
  <div class="row g-2 align-items-end">
    <div class="col-auto">
      <label class="form-label mb-1" for="week-picker-year">Year</label>
      <input type="number" id="week-picker-year" name="year" class="form-control form-control-sm"
             value="{{ year }}" min="2000" max="2100">
    </div>
    <div class="col-auto">
      <label class="form-label mb-1" for="week-picker-week">Week</label>
      <input type="number" id="week-picker-week" name="week" class="form-control form-control-sm"
             value="{{ week }}" min="1" max="53">
    </div>
    <div class="col-auto">
      <button type="submit" class="btn btn-secondary btn-sm">Go</button>
    </div>
    <div class="col-auto ms-auto">
      <a class="btn btn-outline-secondary btn-sm" href="{% url picker_url %}">Current week</a>
    </div>
  </div>
</form>
