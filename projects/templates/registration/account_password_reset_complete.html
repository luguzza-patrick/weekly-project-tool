{% extends "base.html" %}

{% block title %}Password changed{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-sm">
        <div class="card-body">
          <h1 class="h4 mb-3">Password changed</h1>
          <p class="mb-0">
            Your password has been updated. You can now
            <a href="{% url 'login' %}">sign in</a> with your new password.
          </p>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
