<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Weekly Project Tool{% endblock %}</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  {% block head %}{% endblock %}
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="{% url 'home' %}">Weekly Project Tool</a>
      <div class="navbar-nav">
        <a class="nav-link" href="{% url 'home' %}">Home</a>
        {% if user.is_authenticated %}
          <a class="nav-link" href="{% url 'weekly' %}">Weekly form</a>
          <a class="nav-link" href="{% url 'dashboard' %}">Dashboard</a>
          <a class="nav-link" href="{% url 'trends' %}">Trends</a>
          <a class="nav-link" href="{% url 'notifications' %}">
            Notifications
            {% if unread_notifications %}
              <span class="badge text-bg-danger">{{ unread_notifications }}</span>
            {% endif %}
          </a>
          <a class="nav-link" href="{% url 'logout' %}">Logout</a>
        {% else %}
          <a class="nav-link" href="{% url 'login' %}">Login</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="container my-4">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
