[project]
name = "weekly-project-tool"
version = "0.1.0"
description = "Tool for managing project feedback weekly"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "django>=5.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"